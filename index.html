<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Solo / Duo & Campeões</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1, h2 { text-align: center; color: #38bdf8; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        input { padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; width: 320px; }
        button { padding: 12px 24px; font-size: 16px; border-radius: 6px; border: none; background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        
        .terminal { background-color: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 14px; color: #38bdf8; max-height: 200px; overflow-y: auto; margin-bottom: 20px; display: none; }
        .terminal p { margin: 4px 0; }

        .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; border-radius: 8px; padding: 20px; text-align: center; border: 1px solid #334155; }
        .card h3 { margin-top: 0; color: #94a3b8; }
        .stat-main { font-size: 32px; font-weight: bold; color: #38bdf8; margin: 10px 0; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: #94a3b8; }
        .win { color: #4ade80; font-weight: bold; }
        .loss { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Analisador de Solo/Duo & Campeões</h1>
    <div class="search-box">
        <input type="text" id="riotId" placeholder="Invocador#TAG (ex: viés da ilusão#ctrl)">
        <button id="btnAnalisar" onclick="buscarDados()">Analisar</button>
    </div>

    <div id="terminal" class="terminal"></div>

    <div id="results" style="display: none;">
        <div class="cards-grid">
            <div class="card">
                <h3>👤 JOGANDO SOLO</h3>
                <div class="stat-main" id="soloWinrate">0%</div>
                <p id="soloDetails">0 Partidas (0V / 0D)</p>
            </div>
            <div class="card">
                <h3>👥 JOGANDO EM DUO</h3>
                <div class="stat-main" id="duoWinrate">0%</div>
                <p id="duoDetails">0 Partidas (0V / 0D)</p>
            </div>
        </div>

        <h2>⚔️ Campeões Mais Jogados na Season</h2>
        <table>
            <thead>
                <tr>
                    <th>Campeão</th>
                    <th>Partidas</th>
                    <th>Vitórias / Derrotas</th>
                    <th>Winrate</th>
                </tr>
            </thead>
            <tbody id="champsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let evtSource = null;

    function buscarDados() {
        const input = document.getElementById('riotId').value;
        if (!input.includes('#')) {
            alert('Digite no formato: Nome#TAG');
            return;
        }

        const parts = input.split('#');
        const gameName = parts[0].trim();
        const tagLine = parts[1].trim();

        const terminal = document.getElementById('terminal');
        const results = document.getElementById('results');
        const btn = document.getElementById('btnAnalisar');

        terminal.innerHTML = '';
        terminal.style.display = 'block';
        results.style.display = 'none';
        btn.disabled = true;

        if (evtSource) evtSource.close();

        evtSource = new EventSource(`http://localhost:3000/api/duos-stream/${encodeURIComponent(gameName)}/${encodeURIComponent(tagLine)}`);

        evtSource.onmessage = function(event) {
            const data = JSON.parse(event.data);

            if (data.type === 'log') {
                const p = document.createElement('p');
                p.textContent = data.message;
                terminal.appendChild(p);
                terminal.scrollTop = terminal.scrollHeight;
            } 
            else if (data.type === 'error') {
                alert(data.message);
                btn.disabled = false;
                evtSource.close();
            } 
            else if (data.type === 'done') {
                btn.disabled = false;
                evtSource.close();

                const { soloStats, duoStats, champions } = data.data;

                // Exibe os dados nos Cards de Solo e Duo
                document.getElementById('soloWinrate').textContent = `${soloStats.winrate}%`;
                document.getElementById('soloDetails').innerHTML = `${soloStats.matches} Partidas (<span class="win">${soloStats.wins}V</span> / <span class="loss">${soloStats.losses}D</span>)`;

                document.getElementById('duoWinrate').textContent = `${duoStats.winrate}%`;
                document.getElementById('duoDetails').innerHTML = `${duoStats.matches} Partidas (<span class="win">${duoStats.wins}V</span> / <span class="loss">${duoStats.losses}D</span>)`;

                // Exibe a tabela dos campeões mais jogados
                const tbody = document.getElementById('champsTableBody');
                tbody.innerHTML = '';

                champions.forEach(champ => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${champ.name}</strong></td>
                        <td>${champ.matches}</td>
                        <td><span class="win">${champ.wins}W</span> / <span class="loss">${champ.losses}L</span></td>
                        <td><strong>${champ.winrate}%</strong></td>
                    `;
                    tbody.appendChild(row);
                });

                results.style.display = 'block';
            }
        };

        evtSource.onerror = function() {
            btn.disabled = false;
            evtSource.close();
        };
    }
</script>

</body>
</html>
